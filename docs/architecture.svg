<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 450" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
  </defs>
  <rect width="1110" height="450" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#263238">Automated CI/CD Pipeline on AWS</text>

  <!-- Developer -->
  <rect x="20" y="135" width="100" height="70" rx="8" fill="#ECEFF1" stroke="#546E7A"/>
  <text x="70" y="165" font-size="13" text-anchor="middle" fill="#263238">Developer</text>
  <text x="70" y="183" font-size="10" text-anchor="middle" fill="#546E7A">git push to main</text>

  <!-- Pipeline -->
  <rect x="160" y="85" width="560" height="150" rx="10" fill="#FAFAFF" stroke="#5E35B1" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="172" y="106" font-size="13" font-weight="bold" fill="#5E35B1">AWS CodePipeline</text>

  <line x1="120" y1="170" x2="178" y2="170" stroke="#37474F" marker-end="url(#ah)"/>
  <rect x="180" y="125" width="140" height="80" rx="8" fill="#E8F5E9" stroke="#43A047"/>
  <text x="250" y="156" font-size="13" text-anchor="middle" fill="#263238">Source</text>
  <text x="250" y="174" font-size="10" text-anchor="middle" fill="#546E7A">CodeCommit repo</text>
  <text x="250" y="188" font-size="10" text-anchor="middle" fill="#546E7A">(or GitHub connection)</text>

  <rect x="360" y="125" width="140" height="80" rx="8" fill="#E3F2FD" stroke="#1E88E5"/>
  <text x="430" y="156" font-size="13" text-anchor="middle" fill="#263238">Build</text>
  <text x="430" y="174" font-size="10" text-anchor="middle" fill="#546E7A">CodeBuild</text>
  <text x="430" y="188" font-size="10" text-anchor="middle" fill="#546E7A">smoke tests, buildspec.yml</text>

  <rect x="540" y="125" width="160" height="80" rx="8" fill="#FFF3E0" stroke="#EF6C00"/>
  <text x="620" y="156" font-size="13" text-anchor="middle" fill="#263238">Deploy</text>
  <text x="620" y="174" font-size="10" text-anchor="middle" fill="#546E7A">CodeDeploy</text>
  <text x="620" y="188" font-size="10" text-anchor="middle" fill="#546E7A">appspec.yml, rolling deploy</text>

  <line x1="320" y1="165" x2="360" y2="165" stroke="#37474F" marker-end="url(#ah)"/>
  <line x1="500" y1="165" x2="540" y2="165" stroke="#37474F" marker-end="url(#ah)"/>

  <!-- Artifact bucket -->
  <rect x="360" y="285" width="140" height="56" rx="8" fill="#E8F5E9" stroke="#43A047"/>
  <text x="430" y="310" font-size="13" text-anchor="middle" fill="#263238">S3 artifact bucket</text>
  <text x="430" y="327" font-size="10" text-anchor="middle" fill="#546E7A">versioned build output</text>
  <line x1="430" y1="205" x2="430" y2="285" stroke="#37474F" marker-end="url(#ah)"/>
  <text x="438" y="250" font-size="10" fill="#546E7A">artifact</text>
  <polyline points="500,313 620,313 620,205" fill="none" stroke="#37474F" marker-end="url(#ah)"/>
  <text x="628" y="260" font-size="10" fill="#546E7A">release bundle</text>

  <!-- Target environment -->
  <rect x="745" y="75" width="345" height="325" rx="10" fill="#FCFFFC" stroke="#2E7D32" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="757" y="95" font-size="13" font-weight="bold" fill="#2E7D32">VPC</text>
  <rect x="867" y="10" width="100" height="38" rx="6" fill="#ECEFF1" stroke="#546E7A"/>
  <text x="917" y="34" font-size="12" text-anchor="middle" fill="#263238">Users</text>
  <line x1="917" y1="48" x2="917" y2="110" stroke="#37474F" marker-end="url(#ah)"/>
  <rect x="765" y="110" width="305" height="36" rx="6" fill="#FFF3E0" stroke="#EF6C00"/>
  <text x="917" y="133" font-size="13" text-anchor="middle" fill="#263238">Application Load Balancer</text>

  <rect x="765" y="180" width="305" height="170" rx="8" fill="none" stroke="#EF6C00" stroke-dasharray="5 3"/>
  <text x="917" y="198" font-size="11" text-anchor="middle" fill="#EF6C00">Auto Scaling group (min 2)</text>
  <rect x="780" y="212" width="130" height="80" rx="6" fill="#FFF3E0" stroke="#EF6C00"/>
  <text x="845" y="240" font-size="12" text-anchor="middle" fill="#263238">EC2 (AZ a)</text>
  <text x="845" y="258" font-size="10" text-anchor="middle" fill="#546E7A">CodeDeploy agent</text>
  <text x="845" y="272" font-size="10" text-anchor="middle" fill="#546E7A">Apache httpd</text>
  <rect x="925" y="212" width="130" height="80" rx="6" fill="#FFF3E0" stroke="#EF6C00"/>
  <text x="990" y="240" font-size="12" text-anchor="middle" fill="#263238">EC2 (AZ b)</text>
  <text x="990" y="258" font-size="10" text-anchor="middle" fill="#546E7A">CodeDeploy agent</text>
  <text x="990" y="272" font-size="10" text-anchor="middle" fill="#546E7A">Apache httpd</text>
  <line x1="845" y1="146" x2="845" y2="212" stroke="#37474F" marker-end="url(#ah)"/>
  <line x1="990" y1="146" x2="990" y2="212" stroke="#37474F" marker-end="url(#ah)"/>
  <text x="917" y="326" font-size="10" text-anchor="middle" fill="#546E7A">ValidateService hook checks /health.html</text>
  <text x="917" y="341" font-size="10" text-anchor="middle" fill="#546E7A">before an instance returns to the ALB</text>

  <!-- CodeDeploy to ASG -->
  <polyline points="700,165 722,165 722,252" fill="none" stroke="#37474F"/>
  <line x1="722" y1="252" x2="778" y2="252" stroke="#37474F" marker-end="url(#ah)"/>

  <!-- IAM -->
  <rect x="20" y="375" width="700" height="40" rx="8" fill="#F5F5F5" stroke="#9E9E9E"/>
  <text x="370" y="400" font-size="12" text-anchor="middle" fill="#37474F">IAM service roles: CodePipeline, CodeBuild, CodeDeploy, plus an EC2 instance profile</text>

  <text x="20" y="440" font-size="10" fill="#78909C">Every push to main triggers the pipeline: Source, then Build and test, then rolling deployment to the Auto Scaling group.</text>
</svg>
